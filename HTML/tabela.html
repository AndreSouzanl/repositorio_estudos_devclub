<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>
</head>
<body>
  <table border="1" cellpadding="10">
    <caption>Gasto mensais</caption>
    <thead>
      <tr>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Aluguel</td>
        <td>R$ 1.500,00</td>
        <td>01/01/2023</td>
      </tr>
      <tr>
        <td>Alimentação</td>
        <td>R$ 800,00</td>
        <td>01/01/2025</td>
      </tr>
      <tr>
        <td>Diversão</td>
        <td>R$ 50,00</td>
        <td>01/11/2026</td>
      </tr>
      <tr>
        <td>Transporte</td>
        <td>R$ 25,00</td>
        <td>02/11/2026</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
