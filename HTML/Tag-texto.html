<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags para Texto</title>
</head>
<body>
  <!-- Titulos -->
  <h1>Título h1</h1>
  <h2>Título h2</h2>
  <h3>Título h3</h3>
  <h4>Título h4</h4>
  <h5>Título h5</h5>
  <h6>Título h6</h6>
  
  <!-- Parágrafos -->
  <p>Eu quero escrever <br> um paragráfo.</p>
  <p>Eu quero escrever outro <b>paragráfo</b>.</p>
  <p>Este é um <i>paragráfo </i></p>
  <p>Este para é feito com tag strong <strong>paragráfo</strong></p>

</body>
</html>
