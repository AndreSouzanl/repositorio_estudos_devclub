<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inputs</title>
</head>

<body>
  <label for="rua">Rua:</label>
  <input id="rua" autocomplete="street-address" autofocus type="text" placeholder="Digite sua rua" />
  <br><br>
  <input type="color">
  <br><br>
  <input type="range" min="10" max="100" value="50">
   <br><br>
  <input type="password" autofocus placeholder="Digite sua senha">
  <br><br>
  <input type="email" placeholder="Digite seu email">
  <br><br>
  <label>
   
    <input type="checkbox">  Aceite os termos
  </label>
  <br><br>
  <input type="file" accept="image/*">
  <br><br>
  <input type="number">
  <br><br>
  <input type="date">
  <br><br>
  <h2>Qual seu gênero</h2>
  
  <input type="radio" id ="masculino" name="sexo">
  <label for="masculino">Masculino</label>
  <br>
 
  <input type="radio" id ="feminino" name="sexo">
   <label for="feminino">Feminino</label>





</body>

</html>
